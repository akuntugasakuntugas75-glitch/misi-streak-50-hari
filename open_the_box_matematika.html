<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open the Box - Lingkaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Soft green/teal background */
            background-image: radial-gradient(#d1fae5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Box styling & animations */
        .box-btn {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
        }
        
        .box-btn:not(.opened):hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4); /* Teal shadow */
        }
        
        .box-btn:not(.opened):active {
            transform: translateY(2px) scale(0.98);
        }

        .box-btn.opened {
            background: #e5e7eb;
            color: #9ca3af;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            transform: scale(0.95);
            cursor: not-allowed;
        }

        /* Modal pop-in animation */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .modal-content {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Option buttons styling */
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:not(:disabled):hover {
            background-color: #f0f9ff;
            border-color: #0ea5e9;
        }
        .option-btn.correct {
            background-color: #22c55e !important; /* Green */
            color: white !important;
            border-color: #16a34a !important;
        }
        .option-btn.wrong {
            background-color: #ef4444 !important; /* Red */
            color: white !important;
            border-color: #dc2626 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 text-slate-800">

    <div class="w-full max-w-4xl mx-auto flex flex-col items-center">
        <!-- Header & Score -->
        <header class="text-center mb-10 w-full bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-2">Open the Box</h1>
            <p class="text-slate-500 font-medium mb-4">Keliling Lingkaran & Panjang Busur</p>
            <div class="inline-flex items-center justify-center bg-teal-50 border border-teal-100 px-6 py-3 rounded-full">
                <span class="text-lg font-semibold text-teal-800">Skor: <span id="score-display" class="text-2xl font-bold ml-2">0 / 8</span></span>
            </div>
        </header>

        <!-- Grid for 8 Boxes -->
        <div id="game-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full">
            <!-- Boxes will be generated by JS -->
        </div>
    </div>

    <div id="question-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content bg-white w-11/12 max-w-xl rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col">
            
            <!-- Question header -->
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <h2 id="modal-box-title" class="text-lg font-bold text-slate-400 uppercase tracking-wider">Kotak #1</h2>
            </div>
            
            <!-- Question Content -->
            <div class="flex-grow flex flex-col items-center justify-center mb-8">
                <p id="question-text" class="text-lg md:text-xl font-medium text-center text-slate-700 mb-6 leading-relaxed"></p>
                <div id="question-image" class="mb-4 flex justify-center items-center empty:hidden">
                    <!-- SVG will be injected here if exists -->
                </div>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full mt-auto">
                <!-- Options buttons will be generated by JS -->
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="modal-content bg-white w-11/12 max-w-md rounded-3xl shadow-2xl p-8 flex flex-col items-center text-center text-slate-800 border-4 border-teal-500">
            <div class="w-20 h-20 bg-teal-100 text-teal-500 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Permainan Selesai!</h2>
            <p class="text-slate-500 mb-6 font-medium">Luar biasa, Anda telah membuka semua kotak.</p>
            
            <div class="bg-slate-50 w-full rounded-2xl p-6 mb-8 border border-slate-100">
                <p class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-1">Total Skor Anda</p>
                <div class="text-5xl font-black text-teal-600">
                    <span id="final-score">0</span><span class="text-2xl text-slate-400 font-bold">/8</span>
                </div>
            </div>
            
            <button onclick="location.reload()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-teal-200 transition-all active:scale-95">
                Mainkan Lagi
            </button>
        </div>
    </div>

    <script>
        const questionsData = [
            {
                id: 1,
                text: "Jika jari-jari sebuah lingkaran adalah 7 cm, berapakah kelilingnya? (Gunakan π = 22/7)",
                options: ["14 cm", "22 cm", "44 cm", "88 cm"],
                correctAnswer: "44 cm",
                image: null
            },
            {
                id: 2,
                text: "Diketahui diameter lingkaran adalah 21 cm. Keliling lingkaran tersebut adalah... (π = 22/7)",
                options: ["33 cm", "44 cm", "66 cm", "132 cm"],
                correctAnswer: "66 cm",
                image: null
            },
            {
                id: 3,
                text: "Perhatikan gambar berikut! Jika jari-jari lingkaran 7 cm dan sudut pusat 90&deg;, berapa panjang busurnya?",
                options: ["7 cm", "11 cm", "22 cm", "44 cm"],
                correctAnswer: "11 cm",
                image: `<svg width="150" height="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#333" stroke-width="2" fill="none"/><path d="M 50 50 L 90 50 A 40 40 0 0 0 50 10 Z" fill="rgba(41, 128, 185, 0.3)" stroke="#2980b9" stroke-width="2"/><text x="55" y="45" font-size="10" font-weight="bold">90&deg;</text><text x="65" y="60" font-size="10">r=7 cm</text></svg>`
            },
            {
                id: 4,
                text: "Sebuah lingkaran memiliki jari-jari 21 cm. Panjang busur di hadapan sudut pusat 60&deg; adalah...",
                options: ["11 cm", "22 cm", "44 cm", "66 cm"],
                correctAnswer: "22 cm",
                image: null
            },
            {
                id: 5,
                text: "Sebuah taman berbentuk setengah lingkaran dengan diameter 14 cm. Keliling total taman tersebut (termasuk garis lurus/diameternya) adalah...",
                options: ["22 cm", "36 cm", "44 cm", "58 cm"],
                correctAnswer: "36 cm",
                image: `<svg width="150" height="90" viewBox="0 0 100 60"><path d="M 10 50 A 40 40 0 0 1 90 50 Z" stroke="#333" stroke-width="2" fill="rgba(39, 174, 96, 0.3)"/><text x="35" y="45" font-size="10" font-weight="bold">d = 14 cm</text></svg>`
            },
            {
                id: 6,
                text: "Keliling sebuah lingkaran adalah 88 cm. Berapakah panjang busur yang menghadap sudut pusat 90&deg;?",
                options: ["11 cm", "22 cm", "44 cm", "88 cm"],
                correctAnswer: "22 cm",
                image: null
            },
            {
                id: 7,
                text: "Jika panjang busur AB adalah 11 cm dengan sudut pusat 90&deg;, maka keliling penuh lingkaran tersebut adalah...",
                options: ["11 cm", "22 cm", "44 cm", "88 cm"],
                correctAnswer: "44 cm",
                image: null
            },
            {
                id: 8,
                text: "Sudut pusat sebuah juring adalah 180&deg;. Jika jari-jari lingkaran adalah 7 cm, panjang busur juring tersebut adalah...",
                options: ["7 cm", "11 cm", "22 cm", "44 cm"],
                correctAnswer: "22 cm",
                image: null
            }
        ];

        let score = 0;
        let openedBoxesCount = 0;
        const totalBoxes = 8;
        let currentBoxElement = null;
        let currentQuestion = null;

        // DOM Elements
        const gridContainer = document.getElementById('game-grid');
        const scoreDisplay = document.getElementById('score-display');
        const modal = document.getElementById('question-modal');
        const modalTitle = document.getElementById('modal-box-title');
        const questionText = document.getElementById('question-text');
        const questionImage = document.getElementById('question-image');
        const optionsContainer = document.getElementById('options-container');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreDisplay = document.getElementById('final-score');

        function initGame() {
            // Render 8 boxes
            for (let i = 0; i < totalBoxes; i++) {
                const boxBtn = document.createElement('button');
                boxBtn.className = 'box-btn w-full aspect-square bg-gradient-to-br from-teal-400 to-teal-600 rounded-2xl flex flex-col items-center justify-center text-white shadow-xl shadow-teal-500/20 border border-teal-300/50';
                
                // Content of the box (Number)
                boxBtn.innerHTML = `
                    <span class="text-4xl md:text-5xl font-black drop-shadow-md">${i + 1}</span>
                `;
                
                // Event listener
                boxBtn.addEventListener('click', () => openBox(i, boxBtn));
                
                gridContainer.appendChild(boxBtn);
            }
        }

        function openBox(index, element) {
            // Prevent clicking already opened box
            if (element.classList.contains('opened')) return;

            currentBoxElement = element;
            currentQuestion = questionsData[index];

            // Set modal content
            modalTitle.textContent = `Kotak #${index + 1}`;
            questionText.innerHTML = currentQuestion.text;
            
            // Set SVG image if exists
            if (currentQuestion.image) {
                questionImage.innerHTML = currentQuestion.image;
            } else {
                questionImage.innerHTML = '';
            }

            // Create option buttons
            optionsContainer.innerHTML = '';
            currentQuestion.options.forEach(option => {
                const optBtn = document.createElement('button');
                optBtn.className = 'option-btn w-full text-left px-5 py-4 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-semibold text-md md:text-lg shadow-sm flex items-center justify-between';
                optBtn.innerHTML = `<span>${option}</span> <span class="w-5 h-5 rounded-full border-2 border-slate-300 flex-shrink-0 ml-3 indicator-circle"></span>`;
                optBtn.addEventListener('click', () => checkAnswer(option, optBtn));
                optionsContainer.appendChild(optBtn);
            });

            // Show modal
            modal.classList.remove('hidden');
            // Small delay to allow display block to apply before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function checkAnswer(selectedOption, buttonElement) {
            // Disable all buttons to prevent multiple clicks
            const allOptionBtns = optionsContainer.querySelectorAll('button');
            allOptionBtns.forEach(btn => btn.disabled = true);

            const isCorrect = selectedOption === currentQuestion.correctAnswer;
            const indicator = buttonElement.querySelector('.indicator-circle');

            if (isCorrect) {
                // Correct answer styling
                buttonElement.classList.add('correct');
                indicator.classList.remove('border-slate-300');
                indicator.classList.add('border-white', 'bg-white');
                indicator.innerHTML = `<svg class="w-full h-full text-green-500 p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                score++;
                updateScoreDisplay();
            } else {
                // Wrong answer styling
                buttonElement.classList.add('wrong');
                indicator.classList.remove('border-slate-300');
                indicator.classList.add('border-white', 'bg-white');
                indicator.innerHTML = `<svg class="w-full h-full text-red-500 p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;

                // Highlight correct answer
                allOptionBtns.forEach(btn => {
                    if (btn.querySelector('span').textContent === currentQuestion.correctAnswer) {
                        btn.classList.add('correct');
                        const corrIndicator = btn.querySelector('.indicator-circle');
                        corrIndicator.classList.remove('border-slate-300');
                        corrIndicator.classList.add('border-white', 'bg-white');
                        corrIndicator.innerHTML = `<svg class="w-full h-full text-green-500 p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                    }
                });
            }

            // Wait 1.5 seconds then close modal and update box state
            setTimeout(() => {
                closeModal();
                markBoxAsOpened();
                checkGameOver();
            }, 1500);
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = `${score} / 8`;
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Wait for transition
        }

        function markBoxAsOpened() {
            if (currentBoxElement) {
                // Change visually
                currentBoxElement.classList.remove('bg-gradient-to-br', 'from-teal-400', 'to-teal-600', 'text-white', 'border-teal-300/50');
                currentBoxElement.classList.add('opened');
                // Replace content with a checkmark to indicate completion
                currentBoxElement.innerHTML = `<svg class="w-12 h-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                
                openedBoxesCount++;
                currentBoxElement = null; // Reset
            }
        }

        function checkGameOver() {
            if (openedBoxesCount === totalBoxes) {
                // Game over
                setTimeout(() => {
                    finalScoreDisplay.textContent = score;
                    gameOverModal.classList.remove('hidden');
                    // Trigger reflow
                    void gameOverModal.offsetWidth;
                    gameOverModal.classList.remove('opacity-0');
                }, 500);
            }
        }

        // Initialize game on load
        window.onload = initGame;

    </script>
</body>
</html>
