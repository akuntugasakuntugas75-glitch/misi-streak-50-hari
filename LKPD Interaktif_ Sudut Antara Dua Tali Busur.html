<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LKPD Interaktif: Sudut Antara Dua Tali Busur</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--tx:#1d2433;--mu:#5d6679;--ac:#4f46e5;--ok:#15803d;--no:#b91c1c;--bd:#dfe3ee;--hl:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--card:#1e2130;--tx:#eceff7;--mu:#a3abc0;--ac:#8b85ff;--ok:#4ade80;--no:#f87171;--bd:#333850;--hl:#272b45}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:.92rem}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.box{background:var(--hl);border-left:4px solid var(--ac);padding:10px 12px;border-radius:8px;margin:10px 0}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
.sl{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.sl input{width:100%}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:.95rem}
.ro div{background:var(--hl);border-radius:8px;padding:6px 10px}
input[type=number],input[type=text]{width:80px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=text]{width:min(100%,220px)}
button.chk{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
.fb{margin-left:8px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.q{padding:10px 0;border-top:1px dashed var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
[hidden]{display:none!important}.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}h3{font-size:1rem;margin:14px 0 4px;color:var(--ac)}
</style></head><body><main>
<div class="card"><h1>📐 LKPD Interaktif</h1>
<div class="mu">Sudut Antara Dua Tali Busur</div>
<div class="row"><label>Nama: <input type="text" id="nm" placeholder="Nama kamu"></label><label>No. Absen: <input type="text" id="ab" style="width:70px" inputmode="numeric"></label><label>Kelompok: <input type="text" id="kl" style="width:70px" inputmode="numeric"></label></div><div class="row">
<b>Skor: <span id="sc">0</span>/<span id="mx">0</span></b></div></div>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>
const R=100,CX=150,CY=150,D=Math.PI/180;
const $=s=>document.querySelector(s);
const P=d=>[CX+R*Math.cos(d*D),CY-R*Math.sin(d*D)];
const ang=(a,v,b)=>{let x=Math.atan2(a[1]-v[1],a[0]-v[0])-Math.atan2(b[1]-v[1],b[0]-v[0]);x=Math.abs(x/D);return x>180?360-x:x};
const f=n=>Math.round(n*10)/10;
const L=(a,b,c='currentColor',w=2,dash='')=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${dash}"/>`;
const T=(p,t,dx=0,dy=0)=>`<text x="${p[0]+dx}" y="${p[1]+dy}" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">${t}</text>`;
const dot=p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#4f46e5"/>`;
const circ=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
const lab=(p,t)=>T(p,t,(p[0]-CX)*.2,(p[1]-CY)*.2+5);
function inter(a,b,c,d){const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d[0],y4=d[1];const k=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/((x1-x2)*(y3-y4)-(y1-y2)*(x3-x4));return[x1+k*(x2-x1),y1+k*(y2-y1)]}
function sliders(defs){return defs.map(([id,n,mn,mx,v])=>`<div class="sl"><label>${n}</label><input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}"><span id="${id}v">${v}°</span></div>`).join('')}
const g=id=>+$('#'+id).value;
function bind(ids,fn){ids.forEach(i=>$('#'+i).oninput=()=>{$('#'+i+'v').textContent=g(i)+'°';fn()});fn()}
let total=0,got=0;const done={};
const DV={};
function ans(id,right,tol=.5){return `<span class="row" style="display:inline-flex"><input type="text" style="width:80px" id="${id}" inputmode="decimal"> <button class="chk" onclick="chk('${id}',${right==='dyn'?'null':right},${tol})">Cek</button><span class="fb" id="${id}f"></span></span>`}
function mc(id,o,r,rv){return o.map((t,i)=>`<button class="opt" onclick="mcc('${id}',${i},${r},'${rv}')">${'abcd'[i]}. ${t}</button>`).join('')+`<span class="fb" id="${id}f"></span>`}
function mcc(id,i,r,rv){const fb=$('#'+id+'f');if(i==r){fb.textContent='✓ Benar!';fb.className='fb ok';$('#'+rv).hidden=false;if(!done[id]){done[id]=1;got++;upd()}}else{fb.textContent='✗ Belum tepat, coba amati lagi';fb.className='fb no'}}
function chk(id,right,tol){let t=$('#'+id).value.trim().replace(',','.'),m=t.match(/^(-?[\d.]+)\/([\d.]+)$/),v=m?m[1]/m[2]:parseFloat(t),fb=$('#'+id+'f');if(right===null)right=DV[id]();if(isNaN(v)){fb.textContent='Isi dulu ya';fb.className='fb no';return}
 if(Math.abs(v-right)<=tol){fb.textContent='✓ Benar!';fb.className='fb ok';if(!done[id]){done[id]=1;got++;upd()}}else{fb.textContent='✗ Coba lagi';fb.className='fb no'}}
function upd(){$('#sc').textContent=got;$('#mx').textContent=total}
// ---------- halaman ----------
const pages={
intro(){return `<div class="card"><h2>🎯 Tujuan Pembelajaran</h2><ul><li>Menemukan rumus sudut antara dua tali busur yang berpotongan <b>di dalam</b> dan <b>di luar</b> lingkaran.</li><li>Menggunakan rumus tersebut untuk menyelesaikan soal.</li></ul>
<h2>📝 Petunjuk</h2><ol><li>Kerjakan Kegiatan 1 dan 2 secara berurutan.</li><li>Geser slider, amati angka yang berubah, lalu isi titik-titik.</li><li>Tekan <b>Cek</b> untuk melihat apakah jawabanmu benar.</li><li>Selesaikan latihan, lalu lihat skormu.</li></ol>
<div class="box"><b>Ingat:</b> sudut keliling = ½ × sudut pusat yang menghadap busur yang sama.</div></div>`},
k2(){return `<div class="card"><h2>Kegiatan 1: Sudut Antara Dua Tali Busur Berpotongan di Dalam Lingkaran</h2><p class="mu">Tali busur PR dan SQ berpotongan di titik T (di dalam lingkaran). O adalah pusat lingkaran.</p>
<svg id="s2" viewBox="0 0 300 300"></svg>${sliders([['a2','Titik R',20,80,50],['b2','Titik S',100,160,120],['c2','Titik P',180,240,200],['d2','Titik Q',260,340,290]])}
<div class="ro"><div>∠POS = <b id="r2a"></b></div><div>∠QOR = <b id="r2b"></b></div><div style="grid-column:1/-1">∠PTS = <b id="r2p"></b></div></div>
<h3>Langkah 1: Selidiki</h3><p>Geser titik-titik. Untuk posisi saat ini, hitung ∠POS + ∠QOR = ${ans('k2a','dyn')}</p>
<p>Bandingkan hasilnya dengan ∠PTS. Coba beberapa posisi. ∠PTS = ${ans('k2b',0.5)} × (∠POS + ∠QOR)</p>
<h3>Langkah 2: Simpulkan</h3><p>Rumus yang tepat untuk ∠PTS adalah:</p>${mc('k2c',['∠POS + ∠QOR','½ (∠POS − ∠QOR)','½ (∠POS + ∠QOR)','2 (∠POS + ∠QOR)'],2,'rv2')}
<div id="rv2" class="box" hidden><b>Rumus:</b> ∠PTS = ½ (∠POS + ∠QOR)<br><span class="mu">Alasan: ∠PTS adalah sudut luar segitiga TSR, jadi ∠PTS = ∠QSR + ∠PRS. Keduanya sudut keliling: ∠QSR = ½∠QOR dan ∠PRS = ½∠POS.</span></div></div>`},
k3(){return `<div class="card"><h2>Kegiatan 2: Sudut Antara Dua Tali Busur Berpotongan di Luar Lingkaran</h2><p class="mu">Tali busur LK dan MN diperpanjang hingga bertemu di titik P di luar lingkaran. Busur LM adalah busur jauh, busur KN adalah busur dekat.</p>
<svg id="s3" viewBox="60 0 400 300" style="max-width:420px"></svg>${sliders([['a3','Garis atas',5,28,22],['b3','Garis bawah',5,28,10]])}
<div class="ro"><div>∠MOL = <b id="r3a"></b></div><div>∠KON = <b id="r3b"></b></div><div style="grid-column:1/-1">∠KPN = <b id="r3p"></b></div></div>
<h3>Langkah 1: Selidiki</h3><p>Geser garis. Untuk posisi saat ini, hitung ∠MOL − ∠KON = ${ans('k3a','dyn')}</p>
<p>Bandingkan hasilnya dengan ∠KPN. Coba beberapa posisi. ∠KPN = ${ans('k3b',0.5)} × (∠MOL − ∠KON)</p>
<h3>Langkah 2: Simpulkan</h3><p>Rumus yang tepat untuk ∠KPN adalah:</p>${mc('k3c',['½ (∠MOL + ∠KON)','½ (∠MOL − ∠KON)','∠MOL − ∠KON','½ (∠KON − ∠MOL)'],1,'rv3')}
<div id="rv3" class="box" hidden><b>Rumus:</b> ∠KPN = ½ (∠MOL − ∠KON)<br><span class="mu">Alasan: pada segitiga KMP, ∠LKM adalah sudut luar di K, jadi ∠LKM = ∠KPN + ∠KMN. Maka ∠KPN = ∠LKM − ∠KMN = ½∠MOL − ½∠KON.</span><br>Tips: di dalam → <b>jumlah</b>, di luar → <b>selisih</b>.</div></div>`},
lat(){const q=[
['1. Dua tali busur berpotongan di dalam lingkaran. Sudut pusat yang menghadap kedua busur yang diapit adalah 70° dan 50°. Besar sudut antara kedua tali busur = ?',null,'q4',null,60],
['2. Dua tali busur berpotongan di luar lingkaran. Sudut pusat busur jauh = 100° dan busur dekat = 30°. Besar sudut di titik potong = ?',null,'q5',null,35],
['3. Sudut di titik potong dua tali busur di luar lingkaran adalah 40°. Jika busur jauh 140°, besar sudut pusat busur dekat = ?',null,'q6',null,60]
];
return `<div class="card"><h2>✍️ Latihan</h2>`+q.map(([t,a,id,t2,v])=>`<div class="q">${t} ${a||ans(id,v)}${t2?`<div style="margin-top:6px">${t2} ${ans(id,v)}</div>`:''}</div>`).join('')+`<div class="box">Skormu: <b id="sc2"></b></div></div>`}
};
// ---------- simulasi ----------
function sim2(){bind(['a2','b2','c2','d2'],()=>{const [r,sv,p,q]=['a2','b2','c2','d2'].map(i=>P(g(i))),O=[CX,CY],X=inter(p,r,sv,q);
 let s=circ+L(p,r,'#4f46e5',2.5)+L(sv,q,'#4f46e5',2.5)+[p,sv,q,r].map(z=>L(z,O,'#888',1,'4')).join('')+[[r,'R'],[sv,'S'],[p,'P'],[q,'Q']].map(([z,t])=>dot(z)+lab(z,t)).join('')+T(X,'T',-2,-8)+dot(O)+T(O,'O',12,16);$('#s2').innerHTML=s;
 const pos=ang(p,O,sv),qor=ang(q,O,r);$('#r2a').textContent=f(pos)+'°';$('#r2b').textContent=f(qor)+'°';$('#r2p').textContent=f(ang(p,X,sv))+'°';DV.k2a=()=>pos+qor})}
function sim3(){bind(['a3','b3'],()=>{const Pm=[220,0],a1=g('a3'),a2=g('b3');
 const hit=t=>{const u=[Math.cos(t*D),Math.sin(t*D)],b=Pm[0]*u[0],c=Pm[0]*Pm[0]-R*R,r=Math.sqrt(b*b-c);return[-b-r,-b+r].map(s=>[Pm[0]+s*u[0],s*u[1]])};
 const [n1,f1]=hit(180-a1),[n2,f2]=hit(180+a2);
 const sv=m=>[m[0]+200,150-m[1]],O=sv([0,0]),Ps=sv(Pm),S=[n1,f1,n2,f2].map(sv);
 const sg=(a,b)=>L(a,b,'#4f46e5',2.5);
 let s=`<circle cx="200" cy="150" r="${R}" fill="none" stroke="currentColor" stroke-width="1.5"/>`+sg(Ps,S[1])+sg(Ps,S[3])+S.map(z=>L(O,z,'#888',1,'4')).join('')+S.map(dot).join('')+dot(O)+T(O,'O',-9,4)+T(Ps,'P',10,5)+T(S[0],'K',0,-9)+T(S[2],'N',0,16)+T(S[1],'L',-10,-6)+T(S[3],'M',-10,14);
 $('#s3').innerHTML=s;
 const ca=m=>Math.atan2(m[1],m[0])/D,far=Math.abs(ca(f1)-ca(f2)),near=Math.abs(ca(n1)-ca(n2));
 $('#r3a').textContent=f(far)+'°';$('#r3b').textContent=f(near)+'°';$('#r3p').textContent=f(a1+a2)+'°';DV.k3a=()=>far-near})}
// ---------- navigasi ----------
const tabs=[['intro','🏠 Petunjuk'],['k2','Kegiatan 1'],['k3','Kegiatan 2'],['lat','Latihan']];
function show(k){$('#nav').innerHTML=tabs.map(([i,n])=>`<button class="${i==k?'on':''}" onclick="show('${i}')">${n}</button>`).join('');$('#v').innerHTML=pages[k]();
 if(k=='k2')sim2();if(k=='k3')sim3();
 total=9;upd();
 if(k=='lat')$('#sc2').textContent='lihat skor di bagian atas';
 scrollTo(0,0)}
show('intro');
</script></body></html>
